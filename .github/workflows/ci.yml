name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # 构建校验（三站 + 扩展；M5 后 studio 无需 supabase 占位）
      - run: pnpm --filter @dailogues/extension build
      - run: pnpm --filter @dailogues/extension build:dev
      - run: pnpm --filter @dailogues/studio build
      - run: pnpm --filter @dailogues/site build
