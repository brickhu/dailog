# 本地调试全家桶（OrbStack）：
#   docker compose up -d          → 起全部
#   pnpm dev:orb                  → 同上（含首次迁移）
# 域名（无端口，OrbStack DNS + 自动 TLS）：
#   site    https://dailog.orb.local          （容器名 dailog）
#   admin   https://admin.dailog.orb.local
#   api     https://api.dailog.orb.local
#   importer https://importer.dailog.orb.local
# 容器间调用走服务名（api/postgres/importer）；宿主机 localhost:端口 同样可达（publish）。
name: dailog

services:
  postgres:
    image: postgres:16-alpine
    container_name: dailog-pg
    environment:
      POSTGRES_USER: dailogues
      POSTGRES_PASSWORD: dailogues
      POSTGRES_DB: dailogues
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailogues"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    container_name: api
    command: sh -c "pnpm --filter @dailogues/api db:migrate && pnpm --filter @dailogues/api dev"
    ports:
      - "8787:8787"
    environment:
      # 覆盖 .env.local（node --env-file 不覆盖已存在的环境变量）
      DATABASE_URL: postgres://dailogues:dailogues@postgres:5432/dailogues
      # 容器内 127.0.0.1 是容器自身——出网代理经 host.docker.internal 指向宿主 socks 代理
      # （宿主直跑时用 .env.local 的 127.0.0.1:1081；compose 环境变量覆盖 .env.local）
      FISH_PROXY_URL: socks5://host.docker.internal:1081
      IMPORTER_URL: http://importer:8798
      # 本地用 http：better-auth 按 baseURL scheme 决定 cookie Secure 标志——
      # https 下 cookie 带 Secure，http 页面登录"成功"但 cookie 不落地（表现为登录失败）。
      # 生产（api.dailog.fm）用 https 不受影响；录音功能仍需 https 访问（安全上下文）
      BETTER_AUTH_URL: http://api.dailog.orb.local
      # 子域共享会话（SSO）：admin/site 登录态互通（Domain=.dailog.orb.local）。
      # localhost:3000 不再可用（host-only 才匹配）——统一用 https://dailog.orb.local（录音/登录均可）
      BETTER_AUTH_COOKIE_DOMAIN: .dailog.orb.local
      APP_ORIGINS: https://dailog.orb.local,https://admin.dailog.orb.local,http://dailog.orb.local,http://admin.dailog.orb.local
      # 本地开发放宽认证限流（容器内请求共享 local 桶）；生产不配，用默认 5 次/分钟
      AUTH_RATE_MAX: 30
      # 部署自动预留管理员（逗号分隔邮箱）：启动时提升为 admin，新注册的也即时提升
      ADMIN_EMAILS: brickhu@qq.com,brickhu@126.com  # 按需增删：启动/注册时自动提升为 admin
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  site:
    build: .
    container_name: dailog
    # 容器内监听 80；OrbStack 域名自动探测多端口服务可能误选（HMR 3001 返回 426）
    # → label 强制域名 HTTP 端口 = 80
    labels:
      - "dev.orbstack.http-port=80"
    command: pnpm --filter @dailogues/site dev
    ports:
      - "3000:80"
      # HMR 3001 不 publish：OrbStack 域名带端口直连容器（dailog.orb.local:3001）
    environment:
      ORB: "1"
      PORT: "80"
      # site 的 server functions（lib/db.ts）直连 postgres——容器内用服务名
      DATABASE_URL: postgres://dailogues:dailogues@postgres:5432/dailogues
      # 统一 VITE_ 一套（构建期注入；服务端代理转发与客户端共用）
      # 服务端代理（node fetch）必须 http：OrbStack 自签证书不被 Node 信任（SELF_SIGNED_CERT_IN_CHAIN）
      VITE_API_BASE_URL: http://api.dailog.orb.local
      # 浏览器端音频 URL 必须 https（https 页面加载 http 音频 = mixed content 被拦）
      VITE_PUBLIC_API_BASE_URL: https://api.dailog.orb.local
      VITE_SITE_BASE_URL: https://dailog.orb.local
      VITE_ADMIN_BASE_URL: https://admin.dailog.orb.local
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

  admin:
    build: .
    container_name: admin
    # 与 site 同构：容器内监听 80（OrbStack 域名路由 80 最稳；5174 的非 80 路由曾落到 site）
    labels:
      - "dev.orbstack.http-port=80"
    command: pnpm --filter @dailogues/admin dev --host 0.0.0.0 --port 80
    ports:
      - "5174:80"
    environment:
      VITE_PROXY_TARGET: http://api:8787
      VITE_PROXY_ORIGIN: http://admin.dailog.orb.local
      VITE_SITE_BASE_URL: https://dailog.orb.local
      VITE_ADMIN_BASE_URL: https://admin.dailog.orb.local
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

  importer:
    build: .
    container_name: importer
    command: pnpm --filter @dailogues/importer dev
    ports:
      - "8798:8798"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
    # 复用旧项目（dailog-dev）的数据卷——项目名改了但数据不丢
    name: dailog-dev_pgdata
