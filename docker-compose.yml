# 本地调试全家桶（OrbStack）：
#   docker compose up -d          → 起全部
#   pnpm dev:orb                  → 同上（含首次迁移）
# 域名（无端口，OrbStack DNS + 自动 TLS）：
#   site    https://dailog.orb.local
#   api     https://api.dailog.orb.local
# 容器间调用走服务名（api/postgres）；宿主机 localhost:端口 同样可达（publish）。
name: dailog

services:
  postgres:
    image: postgres:16-alpine
    container_name: dailog-pg
    environment:
      POSTGRES_USER: dailogues
      POSTGRES_PASSWORD: dailogues
      POSTGRES_DB: dailogues
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailogues"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    container_name: api
    # 强制 OrbStack 域名路由到 api 8787（与 site 的 http-port=80 同理——否则 api.dailog.orb.local
    # 会被泛域名 fallback 路由到 site 容器，表现为返回 site 页面）
    labels:
      - "dev.orbstack.http-port=8787"
      - "dev.orbstack.domains=api.dailog.orb.local"
    # 守护进程跑 dev（文件变化重启 + 崩溃 1s 自愈——tsx watch 崩溃后只等文件变化不重启，
    # 编辑代码的瞬时编译错误会静默杀死 8787）；exec 使守护成为 PID 1 直接收 docker stop 信号
    command: sh -c "pnpm --filter @dailogues/api db:migrate && exec node services/api/dev-supervisor.mjs"
    # 容器级兜底：守护进程本身死亡（OOM 等）时自动拉起（migrate 幂等，重启安全）
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # 覆盖 .env.local（node --env-file 不覆盖已存在的环境变量）
      DATABASE_URL: postgres://dailogues:dailogues@postgres:5432/dailogues
      # 容器内 127.0.0.1 是容器自身——出网代理经 host.docker.internal 指向宿主 socks 代理
      # （宿主直跑时用 .env.local 的 127.0.0.1:1081；compose 环境变量覆盖 .env.local）
      FISH_PROXY_URL: socks5://host.docker.internal:1081
      # 本地开发统一 localhost:3000（去掉 dailog.orb.local 访问路径——其 HMR ws 固定端口
      # 24681 与 OrbStack 转发竞争导致热更新失效；localhost 的 HMR 走动态端口实测正常）。
      # http baseURL → better-auth cookie 非 Secure；不设 cookieDomain → host-only 匹配 localhost
      BETTER_AUTH_URL: http://localhost:8787
      # CORS/CSRF 白名单：http 项保留兼容（本地 http 直连/端口访问来源）
      APP_ORIGINS: https://dailog.orb.local,http://dailog.orb.local,https://api.dailog.orb.local,http://localhost:3000
      # 本地开发放宽认证限流（容器内请求共享 local 桶）；生产不配，用默认 5 次/分钟
      AUTH_RATE_MAX: 30
      # 部署自动预留管理员（逗号分隔邮箱）：启动时提升为 admin，新注册的也即时提升
      ADMIN_EMAILS: brickhu@qq.com,brickhu@126.com  # 按需增删：启动/注册时自动提升为 admin
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/site/node_modules
      - /app/services/api/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/i18n/node_modules
      - /app/packages/auth-ui/node_modules
      - /app/packages/shared/node_modules
      - /app/tools/dailog-editor/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  site:
    build: .
    container_name: dailog
    # 容器内监听 80；OrbStack 域名自动探测多端口服务可能误选（HMR 3001 返回 426）
    # → label 强制域名 HTTP 端口 = 80
    labels:
      - "dev.orbstack.http-port=80"
    command: pnpm --filter @dailogues/site dev
    ports:
      - "3000:80"
    environment:
      ORB: "1"
      PORT: "80"
      # site 的 server functions（lib/db.ts）直连 postgres——容器内用服务名
      DATABASE_URL: postgres://dailogues:dailogues@postgres:5432/dailogues
      # 统一 VITE_ 一套（构建期注入；服务端代理转发与客户端共用）
      # 服务端代理（node fetch）必须 http：OrbStack 自签证书不被 Node 信任（SELF_SIGNED_CERT_IN_CHAIN）
      # 用 compose 服务名 api:8787 而非 *.orb.local 域名——域名路由在 api 容器重启后曾丢失
      # （NXDOMAIN → site 全部 fetch failed/503），服务名经 Docker 内嵌 DNS 恒可靠
      VITE_API_BASE_URL: http://api:8787
      # 浏览器端媒体/API 直连：localhost（http 页面加载 http 资源无 mixed content 问题）
      VITE_PUBLIC_API_BASE_URL: http://localhost:8787
      VITE_SITE_BASE_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/site/node_modules
      - /app/services/api/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/i18n/node_modules
      - /app/packages/auth-ui/node_modules
      - /app/packages/shared/node_modules
      - /app/tools/dailog-editor/node_modules
    depends_on:
      - api

volumes:
  pgdata:
    # 复用旧项目（dailog-dev）的数据卷——项目名改了但数据不丢
    name: dailog-dev_pgdata
