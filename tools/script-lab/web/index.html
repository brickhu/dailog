<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dailog lab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class='login-wrap' id='loginView' style='display:none'>
  <div class='card login-box'>
    <h1 style='margin:0 0 4px'>dailog lab</h1>
    <p class='sub' style='margin:0 0 16px'>登录进入采编控制台</p>
    <label style='display:block;color:#8a91a0;font-size:12px;margin-bottom:6px'>环境</label>
    <select id='envSelect' onchange='onEnvChange()' style='width:100%;box-sizing:border-box;background:#0b0d11;border:1px solid #262b36;color:#e6e8ee;border-radius:6px;padding:9px 12px;font-size:14px;margin-bottom:10px'></select>
    <div id='envStatus' class='muted' style='font-size:12px;margin-bottom:10px'></div>
    <div id='loginMain' class='muted'>加载环境…</div>
  </div>
</div>
<div id='appView' style='display:none'>
  <div class='topbar'>
    <div class='brand-wrap'><span class='brand'>dailog lab</span><span class='env' id='envTag'>—</span></div>
    <div class='user'><span id='userEmail'>—</span><button class='logout-btn' onclick='logout()'>退出</button><button class='icon-btn' onclick='openDesign()' title='提示词设置'>⚙</button></div>
  </div>
  <div class='statbar' id='statbar'>
    <div class='stat' id='statIdle'><b id='pendingCount'>0</b> 条投稿待采集</div>
    <div class='stat' id='statFetching' style='display:none'><span class='mini-spin'></span> 正在采集：<span id='fetchingUrl' class='mono'></span></div>
    <button id='btnBatch' class='pg' onclick='batchFetch()'>批量采集</button>
  </div>
  <div class='wrap' id='listLoading' style='display:none'><div class='card' style='padding:16px'><span class='muted'>加载中....</span></div></div>
  <div class='wrap' id='listWrap'>
    <div class='card' style='padding:0'>
      <table>
        <thead><tr><th></th><th>ID</th><th>标题 / 原文地址</th><th>投稿人</th><th>投稿日期</th><th>状态</th><th>详情</th></tr></thead>
        <tbody id='rows'><tr><td colspan='5' class='muted'>加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
  <div id='pager' class='statbar' style='display:flex;justify-content:flex-end;border:0;background:none;margin:0 24px 12px'></div>
  <div class='wrap' id='detailWrap' style='display:none'></div>
  <div class='wrap' id='designWrap' style='display:none'>
    <span class='back' onclick='backToApp()'>← 返回列表</span>
    <div class='design'>
      <div class='prompt-list' id='promptList'></div>
      <div class='prompt-edit'>
        <div class='prompt-edit-head'>
          <b id='promptName'>—</b>
          <button class='pg' onclick='savePrompt()'>保存</button>
          <span id='promptStatus' class='muted'></span>
        </div>
        <textarea id='promptEditor' spellcheck='false'></textarea>
      </div>
    </div>
  </div>
</div>
<!-- 创作审核结果 drawer -->
<div class='drawer-overlay' id='drawerOverlay' onclick='closeReviewDrawer()'></div>
<div class='drawer' id='drawer'>
  <div class='drawer-head'>
    <span class='title'>创作审核结果</span>
    <button class='drawer-close' id='drawerClose' onclick='closeReviewDrawer()'>✕</button>
  </div>
  <div class='drawer-body' id='drawerBody'><div class='muted'>加载中…</div></div>
  <div class='drawer-foot'>
    <span id='drawerUsage' class='muted' style='font-size:12px;align-self:center'></span>
    <span style='display:flex;gap:10px'>
      <button class='pg' id='btnSend' onclick='sendReview()' style='display:none;background:#4f8cff;color:#fff;border:0'>发送</button>
      <button class='pg' id='btnRetry' onclick='retryReview()'>重试</button>
      <button class='pg' id='btnConfirm' onclick='confirmReview()' style='background:#4f8cff;color:#fff;border:0'>确认</button>
    </span>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
<script src="/js/home.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/settings.js"></script>
<script>boot();</script>
</body>
</html>
